<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product - Mobile Care</title><link rel="stylesheet" href="/css/store.css"></head><body><header class="store-header"><a class="brand" href="/store.html"><span class="brand-icon">MC</span><span>Mobile Care</span></a><a href="/store.html">← Back to Store</a></header><main style="padding:55px 6%"><div id="productDetail"></div></main><script>const id=new URLSearchParams(location.search).get('id');const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(v||0));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));(async()=>{if(!id)return;const r=await fetch('/api/public/store/products/'+encodeURIComponent(id));const p=await r.json();if(!r.ok){document.getElementById('productDetail').innerHTML='<h2>Product not found.</h2>';return}document.getElementById('productDetail').innerHTML=`<div style="display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);gap:45px;align-items:center"><div class="product-img" style="height:420px;border-radius:20px">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.product_name)}">`:'📱'}</div><div><span class="tag">${esc(p.category)}</span><h1>${esc(p.product_name)}</h1><p class="brand-text">${esc(p.brand||'Mobile Care')}</p><h2>${money(p.selling_price)}</h2><p>${p.model_compatibility?`Compatible with: <b>${esc(p.model_compatibility)}</b>`:''}</p><p class="stock">${p.quantity} in stock</p><button class="primary" onclick="buy()">Buy Now</button></div></div>`;window.product=p})();function buy(){const p=window.product;const cart=JSON.parse(localStorage.getItem('mobileCareCart')||'[]');const e=cart.find(i=>Number(i.productId)===Number(p.id));if(e)e.quantity=Math.min(e.quantity+1,p.quantity);else cart.push({productId:p.id,productName:p.product_name,unitPrice:Number(p.selling_price),quantity:1,maxStock:Number(p.quantity)});localStorage.setItem('mobileCareCart',JSON.stringify(cart));location.href='/store.html'};</script></body></html>
