<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Mobile Care</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <meta
    http-equiv="Cache-Control"
    content="no-store, no-cache, must-revalidate"
>
<meta
    http-equiv="Pragma"
    content="no-cache"
>
<meta
    http-equiv="Expires"
    content="0"
>
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <a href="/" class="brand">
            <span class="brand-mark">MC</span>
            <span>Mobile Care</span>
          </a>
          <p>Admin portal</p>
        </div>

        <h1>Welcome back</h1>
        <form id="adminLoginForm" class="auth-form">
          <label>
            <span>Email or Username</span>
            <input type="text" name="identifier" placeholder="admin@mobilecare.com" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" placeholder="••••••••" required />
          </label>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <div class="auth-meta">
          <span></span>
          <strong></strong>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="/js/app.js"></script>
    <script>
window.addEventListener('pageshow', function () {
    const token = localStorage.getItem('mobileCareToken');

    // If there is no active admin session,
    // clear restored login form values.
    if (!token) {
        const form = document.querySelector('form');

        if (form) {
            form.reset();
        }

        form?.querySelectorAll('input').forEach(input => {
            input.value = '';
        });
    }
});
</script>
  </body>
</html>
