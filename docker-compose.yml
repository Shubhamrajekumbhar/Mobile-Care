version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mobilecare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobile_care
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - mobilecare_pgdata:/var/lib/postgresql/data

volumes:
  mobilecare_pgdata:
